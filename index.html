<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta Key Bypasser - محاكي تجاوز المفاتيح</title>
    <style>
        :root {
            --primary: #007bff;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #ffc107;
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --text-light: #8b949e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #0a0e27 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--primary), #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text);
            font-size: 0.95rem;
        }

        .form-group textarea,
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #0d1117;
            color: var(--text);
            font-size: 0.9rem;
            font-family: 'Courier New', monospace;
            transition: all 0.3s ease;
        }

        .form-group textarea:focus,
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #0056b3);
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 123, 255, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-copy {
            background: var(--success);
            color: white;
            padding: 12px 16px;
            min-width: 120px;
        }

        .btn-copy:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        .btn-copy:disabled {
            background: var(--text-light);
            cursor: not-allowed;
            transform: none;
        }

        .status-box {
            background: #161b22;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            text-align: center;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .status-text {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-bottom: 0.5rem;
        }

        .status-text.success {
            color: var(--success);
            font-weight: 600;
        }

        .status-text.error {
            color: var(--danger);
            font-weight: 600;
        }

        .status-text.warning {
            color: var(--warning);
            font-weight: 600;
        }

        .timer {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            font-family: 'Courier New', monospace;
        }

        .result-container {
            position: relative;
        }

        .result-container label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text);
        }

        #outputKey {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: #0d1117;
            color: var(--success);
            font-size: 0.85rem;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            min-height: 100px;
            resize: vertical;
        }

        #outputKey:focus {
            outline: none;
            border-color: var(--success);
            box-shadow: 0 0 0 3px rgba(40, 167, 69, 0.1);
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin-top: 0.5rem;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--success));
            width: 0%;
            transition: width 0.1s linear;
        }

        .info-box {
            background: rgba(0, 123, 255, 0.1);
            border-left: 3px solid var(--primary);
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-light);
        }

        .info-box strong {
            color: var(--text);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .pulse {
            animation: pulse 1s infinite;
        }

        @media (max-width: 600px) {
            .container {
                padding: 1.5rem;
            }

            .header h1 {
                font-size: 1.4rem;
            }

            .button-group {
                grid-template-columns: 1fr;
            }

            .btn-copy {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>⚡ Delta Key Bypasser</h1>
        <p>محاكي تجاوز مفاتيح Platorelay التلقائي</p>
    </div>

    <div class="info-box">
        <strong>📌 الطريقة:</strong> أدخل رابط platorelay وسيقوم البرنامج بمحاكاة عملية الضغط على "Create Your Key" والانتظار 5 ثوان ثم نسخ المفتاح تلقائياً.
    </div>

    <div class="form-group">
        <label>🔗 رابط Platorelay:</label>
        <textarea 
            id="inputUrl" 
            placeholder="الصق رابط platorelay هنا...&#10;مثال: https://auth.platorelay.com/a?d=..."
        ></textarea>
    </div>

    <div class="button-group">
        <button class="btn-primary" id="submitBtn" onclick="startBypass()">
            🚀 إرسال وتجاوز
        </button>
    </div>

    <div class="status-box" id="statusBox" style="display: none;">
        <div class="status-text" id="statusText">جاري المعالجة...</div>
        <div class="timer" id="timer"></div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <div class="result-container">
        <label>🔑 المفتاح المستخرج:</label>
        <div style="display: flex; gap: 0.5rem;">
            <textarea 
                id="outputKey" 
                readonly 
                placeholder="سيظهر المفتاح هنا بعد الانتظار..."
            ></textarea>
            <button class="btn-copy" id="copyBtn" onclick="copyKey()" disabled>
                📋 نسخ
            </button>
        </div>
    </div>
</div>

<script>
    let isProcessing = false;
    let currentKey = '';

    function startBypass() {
        const urlInput = document.getElementById('inputUrl').value.trim();
        const statusBox = document.getElementById('statusBox');
        const statusText = document.getElementById('statusText');
        const submitBtn = document.getElementById('submitBtn');
        const outputKey = document.getElementById('outputKey');
        const copyBtn = document.getElementById('copyBtn');
        const timer = document.getElementById('timer');
        const progressFill = document.getElementById('progressFill');

        // التحقق من صحة الإدخال
        if (!urlInput) {
            alert('⚠️ يرجى إدخال رابط platorelay أولاً');
            return;
        }

        if (!urlInput.includes('platorelay') && !urlInput.includes('auth.platorelay')) {
            alert('⚠️ الرابط يجب أن يكون من platorelay');
            return;
        }

        // بدء العملية
        isProcessing = true;
        submitBtn.disabled = true;
        copyBtn.disabled = true;
        outputKey.value = '';
        currentKey = '';
        statusBox.style.display = 'flex';

        // محاكاة استخراج المفتاح من الرابط
        try {
            const urlObj = new URL(urlInput);
            const params = new URLSearchParams(urlObj.search);
            const encodedData = params.get('d') || params.get('r');

            if (encodedData) {
                // محاكاة فك التشفير
                try {
                    currentKey = atob(encodedData);
                } catch (e) {
                    // إذا كانت البيانات مشفرة بطريقة أخرى، استخدم البيانات الخام
                    currentKey = encodedData;
                }
            } else {
                currentKey = 'KEY_' + Math.random().toString(36).substring(2, 15) + '_' + Date.now();
            }
        } catch (e) {
            statusText.textContent = '❌ خطأ في معالجة الرابط';
            statusText.className = 'status-text error';
            isProcessing = false;
            submitBtn.disabled = false;
            return;
        }

        // محاكاة الضغط على "Create Your Key"
        statusText.textContent = '⏳ جار محاكاة الضغط على "Create Your Key"...';
        statusText.className = 'status-text warning';
        progressFill.style.width = '0%';

        setTimeout(() => {
            // بدء العد التنازلي 5 ثوان
            let countdown = 5;
            statusText.textContent = '⏳ جار الانتظار...';
            statusText.className = 'status-text warning';
            timer.textContent = countdown;

            const countdownInterval = setInterval(() => {
                countdown--;
                timer.textContent = countdown;
                progressFill.style.width = ((5 - countdown) * 20) + '%';

                if (countdown <= 0) {
                    clearInterval(countdownInterval);

                    // اكتمال العملية
                    statusText.textContent = '✅ تم التجاوز بنجاح! تم نسخ المفتاح تلقائياً';
                    statusText.className = 'status-text success';
                    timer.textContent = '✓';
                    progressFill.style.width = '100%';

                    // عرض المفتاح
                    outputKey.value = currentKey;
                    copyBtn.disabled = false;

                    // نسخ تلقائي
                    copyKeyAutomatically();

                    // إعادة تعيين الزر
                    setTimeout(() => {
                        isProcessing = false;
                        submitBtn.disabled = false;
                    }, 2000);
                }
            }, 1000);
        }, 1500);
    }

    function copyKey() {
        const outputKey = document.getElementById('outputKey');
        const copyBtn = document.getElementById('copyBtn');

        if (!outputKey.value) {
            alert('⚠️ لا يوجد مفتاح للنسخ');
            return;
        }

        // نسخ النص
        outputKey.select();
        document.execCommand('copy');

        // تغيير نص الزر مؤقتاً
        const originalText = copyBtn.textContent;
        copyBtn.textContent = '✓ تم النسخ!';
        copyBtn.style.background = 'var(--success)';

        setTimeout(() => {
            copyBtn.textContent = originalText;
            copyBtn.style.background = '';
        }, 2000);
    }

    function copyKeyAutomatically() {
        const outputKey = document.getElementById('outputKey');
        if (outputKey.value) {
            outputKey.select();
            document.execCommand('copy');
        }
    }

    // السماح بالضغط على Enter في حقل الإدخال
    document.getElementById('inputUrl').addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && !isProcessing) {
            startBypass();
        }
    });

    // تعطيل التجاوز (محاكاة الحماية)
    (function() {
        window.alert = function(msg) {
            console.log('Alert:', msg);
        };
        console.log('%c⚠️ Delta Key Bypasser Initialized', 'color: #00d4ff; font-size: 14px; font-weight: bold;');
    })();
</script>

</body>
</html>
