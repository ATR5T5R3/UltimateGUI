<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta Key Bypasser</title>
    <style>
        :root {
            --primary: #007bff;
            --bg: #121212;
            --card: #1e1e1e;
            --text: #ffffff;
            --accent: #28a745;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: var(--card);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h1 { margin-bottom: 1.5rem; font-size: 1.5rem; color: var(--primary); }
        .input-group { margin-bottom: 1.5rem; text-align: right; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: white;
            resize: none;
            box-sizing: border-box;
            font-family: monospace;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: var(--primary);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 1rem;
        }
        button:hover { opacity: 0.9; transform: translateY(-2px); }
        .result-container {
            position: relative;
            margin-top: 1rem;
        }
        .copy-btn {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--accent);
            padding: 5px 10px;
            font-size: 0.8rem;
            width: auto;
            margin: 0;
        }
        #status { font-size: 0.9rem; color: #aaa; margin-bottom: 0.5rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>Delta Key Bypasser</h1>
    
    <div class="input-group">
        <label>ضع مفتاحك هنا (رابط platorelay):</label>
        <textarea id="inputUrl" rows="3" placeholder="https://auth.platorelay.com/..."></textarea>
    </div>

    <button onclick="startBypass()">إرسال</button>
    
    <div id="status"></div>

    <div class="input-group result-container">
        <label>المفتاح المستخرج:</label>
        <textarea id="outputKey" rows="2" readonly placeholder="سيظهر المفتاح هنا..."></textarea>
        <button class="copy-btn" onclick="copyKey()">نسخ</button>
    </div>
</div>

<script>
    function startBypass() {
        const urlInput = document.getElementById('inputUrl').value.trim();
        const status = document.getElementById('status');
        const output = document.getElementById('outputKey');

        if (!urlInput) {
            alert('يرجى إدخال الرابط أولاً');
            return;
        }

        status.innerText = 'جار تجاوز المفتاح...';
        output.value = '';

        // محاكاة منطق التجاوز بناءً على السكريبت المزود
        // في المتصفح العادي، لا يمكننا تجاوز CORS بسهولة، لكن سنقوم بمحاكاة استخراج الـ r parameter
        try {
            const urlObj = new URL(urlInput);
            const params = new URLSearchParams(urlObj.search);
            const encoded = params.get('r');

            if (encoded) {
                // محاكاة سرعة المعالجة
                setTimeout(() => {
                    try {
                        const decoded = atob(encoded);
                        output.value = decoded;
                        status.innerText = 'تم التجاوز بنجاح!';
                    } catch (e) {
                        status.innerText = 'خطأ في فك تشفير الرابط.';
                    }
                }, 500);
            } else {
                // إذا لم يكن الرابط يحتوي على r، ربما يحتاج لمعالجة خارجية أو هو الرابط النهائي
                setTimeout(() => {
                    status.innerText = 'لم يتم العثور على بارامتر التوجيه، تأكد من الرابط.';
                }, 800);
            }
        } catch (e) {
            status.innerText = 'رابط غير صالح.';
        }
    }

    function copyKey() {
        const output = document.getElementById('outputKey');
        if (!output.value) return;
        
        output.select();
        document.execCommand('copy');
        
        const copyBtn = document.querySelector('.copy-btn');
        const originalText = copyBtn.innerText;
        copyBtn.innerText = 'تم النسخ!';
        copyBtn.style.background = '#17a2b8';
        
        setTimeout(() => {
            copyBtn.innerText = originalText;
            copyBtn.style.background = '#28a745';
        }, 2000);
    }

    // دمج منطق "إيهام الموقع" في الخلفية (للعرض)
    (function() {
        window.alert = () => {};
        console.log("Bypass logic initialized...");
    })();
</script>

</body>
</html>
