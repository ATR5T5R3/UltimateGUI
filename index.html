<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>N60 Hub - AI Dashboard</title>
    <style>
        :root { --main-color: #00ff88; --bg-dark: #121212; --card-bg: #1e1e1e; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-dark); color: white; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); width: 400px; text-align: center; }
        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; background: #333; color: white; }
        button { background: var(--main-color); color: black; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
        .chat-box { height: 300px; overflow-y: auto; background: #000; border-radius: 8px; padding: 10px; margin-bottom: 10px; text-align: left; }
        .code-container { background: #2d2d2d; padding: 10px; border-radius: 5px; position: relative; margin: 10px 0; font-family: monospace; }
        .copy-btn { position: absolute; top: 5px; right: 5px; background: var(--main-color); font-size: 10px; border: none; cursor: pointer; padding: 5px; border-radius: 3px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="auth-section" class="container">
        <h2 id="auth-title">تسجيل الدخول - N60</h2>
        <input type="text" id="username" placeholder="اسم المستخدم (مثلاً: n60)">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button onclick="handleAuth()" id="auth-btn">دخول</button>
        <p onclick="toggleAuth()" style="cursor:pointer; font-size: 12px; margin-top: 10px;">ليس لديك حساب؟ إنشاء حساب جديد</p>
    </div>

    <div id="main-site" class="container hidden" style="width: 80%; height: 80vh;">
        <h2>مرحباً بك في مكتبة N60 الذكية</h2>
        <div style="display: flex; gap: 20px; height: 80%;">
            <div style="flex: 1; background: #252525; padding: 10px; border-radius: 8px;">
                <h3>أبحاثي الأخيرة</h3>
                <ul id="research-list" style="list-style: none; padding: 0;"></ul>
            </div>
            <div style="flex: 2; display: flex; flex-direction: column;">
                <div id="chat-display" class="chat-box"></div>
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="user-input" placeholder="اسأل AI (مثلاً: سويلي سكربت Lua)...">
                    <button style="width: 80px;" onclick="askAI()">إرسال</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isSignUp = false;

        function toggleAuth() {
            isSignUp = !isSignUp;
            document.getElementById('auth-title').innerText = isSignUp ? "إنشاء حساب" : "تسجيل الدخول";
            document.getElementById('auth-btn').innerText = isSignUp ? "تسجيل" : "دخول";
        }

        function handleAuth() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            if (isSignUp) {
                localStorage.setItem('userData', JSON.stringify({user, pass}));
                alert("تم إنشاء الحساب بنجاح!");
                toggleAuth();
            } else {
                const stored = JSON.parse(localStorage.getItem('userData'));
                if (stored && stored.user === user && stored.pass === pass) {
                    document.getElementById('auth-section').classList.add('hidden');
                    document.getElementById('main-site').classList.remove('hidden');
                    loadResearch();
                } else { alert("خطأ في البيانات!"); }
            }
        }

        // نظام الحماية والذكاء الاصطناعي (محاكاة)
        const forbiddenKeywords = ["dark web", "دارك ويب", "اختراق", "hack site", "موقع اباحي"];

        function askAI() {
            const input = document.getElementById('user-input').value;
            const chatDisplay = document.getElementById('chat-display');
            
            if (forbiddenKeywords.some(word => input.toLowerCase().includes(word))) {
                chatDisplay.innerHTML += `<p style="color:red;">⚠️ عذراً، هذا الطلب غير قانوني ولا يمكنني تنفيذه.</p>`;
                return;
            }

            let response = "";
            if (input.includes("سكربت Lua")) {
                const code = `-- N60 Hub Script\nprint("Hello from N60!")\nlocal player = game.Players.LocalPlayer`;
                response = `تفضل الكود الخاص بك: <div class="code-container"><button class="copy-btn" onclick="copyCode(this)">نسخ</button><pre>${code}</pre></div>`;
            } else {
                response = `أنا AI الخاص بـ N60، كيف يمكنني مساعدتك في أبحاثك؟`;
            }

            chatDisplay.innerHTML += `<p><b>أنت:</b> ${input}</p><p><b>AI:</b> ${response}</p>`;
            saveResearch(input);
        }

        function copyCode(btn) {
            const code = btn.nextElementSibling.innerText;
            navigator.clipboard.writeText(code);
            btn.innerText = "تم النسخ!";
            setTimeout(() => btn.innerText = "نسخ", 2000);
        }

        function saveResearch(text) {
            let res = JSON.parse(localStorage.getItem('research')) || [];
            res.push(text);
            localStorage.setItem('research', JSON.stringify(res));
            loadResearch();
        }

        function loadResearch() {
            const list = document.getElementById('research-list');
            const res = JSON.parse(localStorage.getItem('research')) || [];
            list.innerHTML = res.map(item => `<li style="font-size:12px; border-bottom:1px solid #444; padding:5px;">${item}</li>`).join('');
        }
    </script>
</body>
</html>
